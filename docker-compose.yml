services:
  backend:
    build: {context: ., dockerfile: Dockerfile.backend}
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./models:/app/models", "./results:/app/results"]
  frontend:
    build: {context: ., dockerfile: Dockerfile.frontend}
    ports: ["3000:80"]
    depends_on: [backend]

