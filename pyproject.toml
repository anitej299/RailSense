[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railsense"
version = "1.0.0"
description = "Research prototype for robust smartphone railway vibration anomaly detection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
  "torch>=2.1", "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.5",
  "pyyaml>=6", "joblib>=1.3", "matplotlib>=3.7", "python-multipart>=0.0.9",
  "httpx>=0.26", "psutil>=5.9", "onnx>=1.15"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
xgboost = ["xgboost>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

